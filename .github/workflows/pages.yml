name: Deploy reports
on:
  push:
    branches: [main]
    paths: ['results/**/*.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir site
          (cd results && find . -name '*.html' -exec cp --parents {} ../site/ \;)
          {
            echo '<!doctype html><meta charset="utf-8"><title>Reports</title><h1>Reports</h1><ul>'
            (cd site && find . -name '*.html' ! -name index.html | sort | sed 's|^\./||' | while read f; do echo "<li><a href=\"$f\">$f</a></li>"; done)
            echo '</ul>'
          } > site/index.html
          ls -R site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
