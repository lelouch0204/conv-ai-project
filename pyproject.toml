[project]
name = "conv-ai-project"
version = "0.1.0"
description = "When Should a Voice Agent Think Ahead? Scheduling Early Drafts on a Shared GPU"
readme = "EXPERIMENT_PLAN.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
